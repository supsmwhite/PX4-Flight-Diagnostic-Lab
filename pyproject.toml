[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "px4-flight-diag"
version = "0.2.0"
description = "Read-only PX4 MAVLink capture and offline diagnostics"
requires-python = ">=3.10"
dependencies = ["pymavlink==2.4.49", "PyYAML>=6.0,<7", "plotly>=5.24,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=13,<16"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
px4-flight-diag = "px4_flight_diag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"px4_flight_diag.live" = ["static/*.html", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
